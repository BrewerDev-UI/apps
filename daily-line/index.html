/* ----- the LSAT stop ----- */
function teachHTML(cs, st) {
  const s = cs.stop, t = st.t, n = s.teach.length;
  const firstIdea = st.i === 0;
  return `${firstIdea ? `<p class="goal"><span class="label">This stop</span>${smart(s.g)}</p>` : ''}
    <article class="sc tp" style="--c:${LSAT.color}">
      <div class="sc-band"></div>
      <div class="tp-in">
        <span class="label">Idea ${st.i + 1} of ${n}</span>
        <h3>${fmt(t.h)}</h3>
        ${t.b ? `<div class="tp-b">${fmtBlock(t.b)}</div>` : ''}
        ${t.ex ? `<div class="ex"><span class="ex-label">Example</span><p>${fmt(t.ex)}</p>${legendFor(t.ex)}</div>` : ''}
        ${t.dia ? `<div class="dia" role="img" aria-label="${esc(t.dia.join('. ').replace(/->/g, 'arrow'))}">${t.dia.map((l) => `<div>${fmtDia(l)}</div>`).join('')}</div>` : ''}
        ${t.a ? `<div class="tp-b">${fmtBlock(t.a)}</div>` : ''}
      </div>
    </article>
    <div class="actions" id="ride-actions"><button class="btn primary big" type="button" data-act="ls-next">${st.i === n - 1 ? 'Start practice' : 'Next idea'} →</button><span class="hint kb">Space or Enter works too.</span></div>`;
}
function itemHTML(cs, st, idx) {
  const it = st.it, done = st.right !== undefined, ans = cs.ans;
  const picks = it.k === 'sort' ? (Array.isArray(ans) ? ans : it.i.map(() => null)) : null;
  const practiceNo = cs.steps.slice(0, idx + 1).filter((x) => x.k === 'item' && !x.look).length;
  const practiceOf = cs.steps.filter((x) => x.k === 'item' && !x.look).length;
  const label = st.look ? `${ICON.back}<span>Look back · from Stop ${it.stop.no}: ${smart(it.stop.t)}</span>` : `<span>${cs.stop && cs.stop.check ? 'Checkpoint' : 'Practice'} · ${practiceNo} of ${practiceOf}</span>`;
  let body = '';
  if (it.k === 'mc') {
    body = `${it.p ? `<div class="passage">${fmt(it.p)}</div>` : ''}
      <p class="q lq">${fmt(it.q)}</p>
      <div class="opts">${choicesHTML(it.o, it.ord, done ? ans : null, it.a, 'ls-pick', fmt)}</div>`;
  } else if (it.k === 'tap') {
    const segs = it.s.map((seg, i) => {
      const lead = seg.startsWith('\n') ? '<br>' : '';
      const cls = done ? (i === it.a ? 'right' : i === ans ? 'wrong' : '') : '';
      return `${lead}<span class="seg ${cls}" ${done ? '' : `role="button" tabindex="0" data-act="ls-seg" data-i="${i}"`}>${fmt(seg.replace(/^\n/, ''))}</span>`;
    }).join(' ');
    body = `<p class="q lq">${fmt(it.q)}</p>

        return `<button class="bk ${cls}" type="button" data-act="ls-sort" data-row="${r}" data-b="${bi}" ${rowDone ? 'disabled' : ''} aria-pressed="${bi === got}">${esc(b)}</button>`;
      }).join('');
      return `<div class="srow ${rowDone ? (got === want ? 'right' : 'wrong') : ''}" data-row="${r}"><p>${fmt(text)}</p><div class="bks" role="group" aria-label="Choose one">${bks}</div></div>`;
    }).join('');

    } else if (it.k === 'tap') {

    } else {
      panel = answerPanel({ tone: st.right ? 'good' : 'bad', head: st.right ? 'Correct' : 'Not quite', note, key: KEYS[it.ord.indexOf(it.a)], answer: fmt(it.o[it.a]), why: fmt(whyText(it)) });

    <span class="label lbl-row ${st.look ? 'look' : ''}">${label}</span>
    ${body}
    ${panel}
    <div class="actions" id="ride-actions">${done ? `<button class="btn primary big" type="button" data-act="ls-next">${nextLabel} →</button>` : it.k === 'mc' ? `<span class="hint">Pick an answer.<span class="kb"> Keys A to ${KEYS[it.o.length - 1]} work too.</span></span>` : ''}</div>
  </div>`;
}
function ticketHTML(v) {

function lsatStage(v, head) {

/* ----- shuttle reviews ----- */
// When a card comes back next, in words: "tomorrow", "in 3 days", "Nov 2".
function backIn(card) {
  if (!card.srs) return '';
  const days = Math.round((startOfDay(card.srs.due) - startOfDay()) / DAY);
  if (card.srs.interval === 0 || days <= 0) return 'later today';
  if (days === 1) return 'tomorrow';
  if (days < 7) return `in ${days} days`;
  return 'on ' + fmtDay(keyOf(card.srs.due));
}
function reviewStage(v, head) {
  const card = currentCard(), cur = reviewCur(), d = shuttleDeck();
  const st = cardState(card), src = splitBack(card.back), topic = src.line ? TOPICS.find((t) => t.code === src.line) : null;
  const answered = cur.right !== undefined;
  // A missed card comes back before the review ends, so it still counts as one to go.
  const left = session.queue.length - 1 + (cur.right === false ? 1 : 0);
  const nextBtn = `<button class="btn primary big" type="button" data-act="rv-next">${left > 0 ? 'Next card' : 'Finish reviews'} →</button><span class="hint left-hint">${left > 0 ? `${plural(left, 'card')} to go` : 'That was the last card.'}</span>`;
  let choices = '', panel = '', actions;
  if (cur.mc) {
    choices = `<div class="opts">${choicesHTML(cur.mc.o, cur.ord, cur.pos, cur.mc.a, 'rv-pick', fmt)}</div>`;
    if (answered) panel = answerPanel({ tone: cur.right ? 'good' : 'bad', head: cur.right ? 'Correct' : 'Not quite', note: cur.right ? `+1 token · back ${backIn(card)}` : 'You’ll see it again before this review ends.', key: KEYS[cur.ord.indexOf(cur.mc.a)], answer: fmt(cur.mc.o[cur.mc.a]), why: src.text ? fmt(src.text) : '' });
    actions = answered ? nextBtn : `<span class="hint">Pick an answer.<span class="kb"> Keys A to ${KEYS[cur.ord.length - 1]} work too.</span></span>`;
  } else if (!cur.shown) {
    actions = `<button class="btn primary big" type="button" data-act="flip">Show the answer</button><span class="hint">Answer it in your head first.</span>`;
  } else if (!answered) {
    // The first paragraph is the answer; anything after a blank line explains it.
    const [first, ...rest] = (src.text || card.back).split(/\n\s*\n/);
    panel = answerPanel({ tone: 'plain', head: 'The answer', label: '', answer: fmt(first), why: rest.length ? fmt(rest.join('\n\n')) : '' });
    actions = `<div class="selfq"><p class="selfq-q">Did you get it right?</p>
      <div class="selfq-btns"><button class="btn got" type="button" data-act="rv-self" data-got="1">${ICON.check}Yes, I got it</button><button class="btn missed" type="button" data-act="rv-self" data-got="0">${ICON.cross}No, I missed it</button></div>
      <span class="hint">Either one takes you to the next card.</span></div>`;
  } else actions = nextBtn;
  return `<div class="wrap page ride">${head}
    <div class="ride-tools">${exitBtn()}<span class="spacer"></span><button class="btn ghost sm" type="button" data-act="edit-current">${ICON.edit}Edit card</button></div>
    <article class="sc qcard" style="--c:${topic ? topic.color : d.color}">
      <div class="sc-band"></div>
      <div class="sc-meta"><span class="label src">${topic ? tb(topic, 22) : ''}<span>${esc(src.from ? 'From ' + src.from : 'Your card')}</span></span><span class="chip ${st}">${STATE_LABEL[st]}</span></div>
      <div class="qc-in"><p class="q">${fmt(card.front)}</p>${choices}</div>
    </article>
    ${panel}
    <div class="actions" id="ride-actions">${actions}</div>
  </div>`;
}

/* ----- end of the line ----- */
function terminalView(v) {
  const s = streakInfo(), lesson = v.sum.lesson, ls = v.sum.lsat, rv = v.sum.reviews, pass = v.sum.passed;
  const t = lesson ? topicById(lesson.topic) : null;
  const color = t ? t.color : ls ? LSAT.color : SHUTTLE.color;
  const legs = [lesson, ls, rv].filter(Boolean).length;
  const name = legs > 1 ? 'Trip complete' : lesson ? 'Lesson complete' : ls ? (ls.look ? 'Look-back done' : 'LSAT stop done') : rv ? 'Reviews done' : v.sum.empty ? 'Nothing due' : 'Trip ended';
  const parts = [];
  if (lesson) parts.push(`<div><span class="label">Lesson quiz${LEVELS[lesson.level] ? ' · ' + LEVELS[lesson.level].name : ''}</span><b>${lesson.score}/${lesson.of}</b></div>`);
  if (ls && !ls.look) parts.push(`<div><span class="label">LSAT stop ${ls.no}</span><b>${ls.score}/${ls.of}</b></div>`);
  if (ls && (ls.look || ls.lookOf)) parts.push(`<div><span class="label">Look back</span><b>${ls.look ? ls.right : ls.lookRight}/${ls.look ? ls.of : ls.lookOf}</b></div>`);
  if (rv) parts.push(`<div><span class="label">Reviews</span><b>${rv}</b></div>`, `<div><span class="label">Right</span><b>${Math.round(pass / rv * 100)}%</b></div>`);
  parts.push(`<div><span class="label">Tokens</span><b>+${tripTokens(v)}</b></div>`, `<div><span class="label">Streak</span><b>${s.streak}</b></div>`);
  const msg = [];
  if (lesson) msg.push(lesson.score === lesson.of ? 'Perfect lesson.' : lesson.score >= lesson.of - 1 ? 'Nicely done.' : "Good start. It'll stick better tomorrow.");
  // After a perfect quiz, point to the next difficulty up (Claude lessons only; built-in lessons are always Hard).
  const up = lesson && lesson.score === lesson.of && lesson.source !== 'bank' && LEVELS[lesson.level] ? LEVEL_IDS[LEVEL_IDS.indexOf(lesson.level) + 1] : null;
  if (up && lessonLevel() === lesson.level) msg.push(`Want it tougher? Switch lesson questions to ${LEVELS[up].name} in Settings.`);
  if (lesson && lesson.added) msg.push(`${plural(lesson.added, 'card')} from the lesson boarded the Review Shuttle for tomorrow.`);
  if (ls && !ls.look) { const nx = nextStop(); msg.push(nx ? `Next on the LSAT Line: Stop ${nx.no}, ${nx.t}.` : 'You’ve ridden every stop on the LSAT Line.'); }
  if (v.sum.empty) msg.push('No cards were due. You can still review the whole shuttle from its page.');
  if (s.activeToday) msg.push(`Day ${s.streak} in a row. Your pass is good through ${fmtLong(shift(today(), 1))}.`);
  const lsStop = ls && !ls.look ? STOP_BY_ID.get(ls.id) : null;
  const ready = readyIn(SHUTTLE.id), lsatTodo = !v.plan.lsat ? lsatLeg() : null;
  const offers = [];
  if (lsatTodo && lsatTodo !== 'look') { const ns = STOP_BY_ID.get(lsatTodo); offers.push(`<button class="sign offer" type="button" data-act="ride-lsat" data-stop="${ns.id}">${lb(40)}<span class="sign-text"><span class="kicker">Transfer</span><h2>Ride LSAT Stop ${ns.no}</h2><p>${smart(ns.t)} · about 5 min.</p></span></button>`); }
  if (!v.plan.review && ready) offers.push(`<button class="sign offer" type="button" data-act="ride-review" data-deck="${SHUTTLE.id}">${dbl(shuttleDeck(), 40)}<span class="sign-text"><span class="kicker">Transfer</span><h2>Ride your reviews</h2><p>${esc(countsText(deckCounts(SHUTTLE.id)))} on the Review Shuttle.</p></span></button>`);
  const backLabel = v.back && v.back.name === 'line' ? 'Back to the line' : v.back && v.back.tab === 'lines' ? 'Back to all lines' : v.back && v.back.tab === 'log' ? 'Back to the log' : 'Back to Today';
  return `<div class="wrap page ride">
    <section class="tablet" style="--c:${color}"><div class="tablet-in">
      <span class="tablet-kicker">End of the line</span>
      <h1 class="tablet-name">${name}</h1>
      <span class="tablet-sub">${esc(fmtLong(today()))}</span>
    </div></section>
    ${lesson || lsStop ? `<div class="stubs">${lesson ? stubHTML({ day: lesson.day, topic: lesson.topic, title: lesson.title, score: lesson.score, of: lesson.of }, lesson.no, 'print') : ''}${lsStop ? lsatStubHTML(lsStop, { d: ls.day, l: ls.day, s: ls.score, o: ls.of }, 'print') : ''}</div>` : ''}
    <section class="summary" aria-label="Trip summary">${parts.join('')}</section>
    ${msg.length ? `<p class="lead">${smart(msg.join(' '))}</p>` : ''}
    ${offers.join('')}
    <div class="actions"><button class="btn primary big" type="button" data-act="trip-exit">${backLabel}</button><button class="btn" type="button" data-act="open-lsat">LSAT Line</button></div>
  </div>`;
}

function armButton(btn, label, fn) {

// A shuttle card: a question, its answer choices (the right one and up to four wrong ones), and an explanation.
// With no wrong answers it's a check-yourself card: the right answer and the explanation show together.
function cardModal(card) {
  const isNew = !card, mc = card && card.mc;
  const right = mc ? mc.o[mc.a] : '';
  const wrong = mc ? mc.o.filter((_, i) => i !== mc.a) : [];
  const wrongField = (i) => `<div class="choice"><label for="f-wrong-${i}">Wrong answer ${i + 1}</label><input id="f-wrong-${i}" type="text" autocomplete="off" value="${esc(wrong[i] || '')}" placeholder="${i ? 'Optional' : 'A believable wrong answer'}"></div>`;
  openModal({
    title: isNew ? 'Add a shuttle card' : 'Edit card',
    body: `<div class="field"><label for="f-front">Question</label><textarea id="f-front" required placeholder="What should the card ask?">${card ? esc(card.front) : ''}</textarea></div>
      <fieldset class="field choices"><legend class="flabel">Answer choices</legend>
        <div class="choice is-right"><label for="f-right">Right answer</label><input id="f-right" type="text" autocomplete="off" value="${esc(right)}" placeholder="The correct answer"></div>
        ${[0, 1, 2, 3].map(wrongField).join('')}
        <p class="help">With a right answer and at least one wrong answer, the card is reviewed as multiple choice. Without wrong answers, you check yourself.</p>
      </fieldset>
      <div class="field"><label for="f-back">Explanation</label><textarea id="f-back" placeholder="Why the answer is right, in a sentence or two">${card ? esc(card.back) : ''}</textarea>
        <p class="help">Shown after you answer. Formatting: <code>**bold**</code>, <code>*italic*</code>. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves.</p></div>`,
    actions: `${isNew ? '' : `<button class="btn danger" type="button" id="m-del">Delete</button>${card.srs ? '<button class="btn ghost" type="button" id="m-reset">Reset progress</button>' : ''}`}
      <span class="spacer"></span><button class="btn" type="button" data-close>Cancel</button>
      <button class="btn primary" type="button" id="m-save">Save</button>`,
    onMount(root) {
      const save = () => {
        const front = $('#f-front').value.trim(), rightAns = $('#f-right').value.trim(), expl = $('#f-back').value.trim();
        const seen = new Set([rightAns.toLowerCase()]);
        const wrongs = [0, 1, 2, 3].map((i) => $('#f-wrong-' + i).value.trim()).filter((w) => w && !seen.has(w.toLowerCase()) && seen.add(w.toLowerCase()));
        if (!front) { toast('Add the question'); $('#f-front').focus(); return; }
        if (wrongs.length && !rightAns) { toast('Add the right answer to go with the wrong ones'); $('#f-right').focus(); return; }
        if (!rightAns && !expl) { toast('Add the right answer or an explanation'); $('#f-right').focus(); return; }
        let next = null, back = expl;
        if (wrongs.length) {
          // Keep each answer in its place when only the wording changed; otherwise put the right answer in a random spot.
          if (mc && wrongs.length === wrong.length) { let j = 0; next = { o: mc.o.map((_, i) => (i === mc.a ? rightAns : wrongs[j++])), a: mc.a }; }
          else {
            let o = wrongs.slice(), a = Math.floor(Math.random() * (o.length + 1));
            o.splice(a, 0, rightAns);
            // Numbers read best smallest first, and number choices are shown in the order saved.
            const num = (s) => parseFloat((String(s).replace(/,/g, '').match(/-?\d+(\.\d+)?/) || ['0'])[0]);
            if (o.every((s) => /\d/.test(s))) { o = o.slice().sort((x, y) => num(x) - num(y)); a = o.indexOf(rightAns); }
            next = { o, a };
          }
          if (mc && mc.f) next.f = 1;
        } else if (rightAns) back = expl ? `${rightAns}\n\n${expl}` : rightAns;
        if (isNew) L.cards.push({ id: 'c-' + uid(), deckId: SHUTTLE.id, level: 1, front, back, created: Date.now(), srs: null, mc: next });
        else {
          Object.assign(card, { front, back, mc: next });
          // A card being reviewed right now shows its new wording, unless it was already answered.
          if (session && session.cur && session.cur.id === card.id && session.cur.right === undefined) session.cur = null;
        }
        commit('cards', 'mc');
        modalClose(); render(); toast(isNew ? 'Card added' : 'Card saved');
      };
      $('#m-save').addEventListener('click', save);
      $('#m-form').addEventListener('submit', (e) => { e.preventDefault(); save(); });
      root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });
      if (!isNew) {
        armButton($('#m-del'), 'Tap again to delete', () => {
          L.cards = L.cards.filter((c) => c.id !== card.id);
          if (session) { session.queue = session.queue.filter((id) => id !== card.id); if (session.cur && session.cur.id === card.id) session.cur = null; }
          commit('cards', 'srs', 'mc'); modalClose(); render(); toast('Card deleted');
        });
        const reset = $('#m-reset');
        if (reset) reset.addEventListener('click', () => { card.srs = null; commit('srs'); modalClose(); render(); toast('Card reset to new'); });
      }
    },
  });
}

/* ================= backup and import ================= */
function backupJSON() {
  return JSON.stringify({ app: 'daily-line', version: 3, exported: new Date().toISOString(), lessons: bodyOf('progress'), lsat: { meta: bodyOf('lsat'), srs: bodyOf('srs'), cards: bodyOf('cards'), mc: bodyOf('mc') }, course: bodyOf('course') }, null, 2);
}
function analyzeImport(text) {
  const t = String(text || '').trim();
  if (!t) return { error: 'Paste a backup or choose a file first.' };
  if (!t.startsWith('{')) return { error: 'That isn’t a Daily Line backup. A backup is a block of text that starts with “{”.' };
  let data;
  try { data = JSON.parse(t); } catch (e) { return { error: 'That backup could not be read. Check that the whole thing was copied.' }; }
  if (data && data.app === 'daily-line') {
    const nLessons = data.lessons && Array.isArray(data.lessons.history) ? data.lessons.history.length : 0;
    const course = data.course ? normCourse(data.course) : null;
    const nStops = course ? STOPS.filter((s) => course.done[s.id]).length : 0;
    const shuttleCards = hydrateLsat(data.lsat && data.lsat.meta, data.lsat && data.lsat.srs, data.lsat && data.lsat.cards, data.lsat && data.lsat.mc).cards.length;
    return {
      summary: `Daily Line backup${data.exported ? ' from ' + esc(new Date(data.exported).toLocaleDateString()) : ''}: ${plural(nLessons, 'lesson')}, ${plural(shuttleCards, 'shuttle card')}${course ? ` and ${plural(nStops, 'LSAT stop')}` : ''}. Importing replaces ${course ? 'everything' : 'your lessons and shuttle'} here.${course ? '' : ' This backup is from before the LSAT Line, so your LSAT progress stays as it is.'}`,
      button: course ? 'Replace everything' : 'Replace lessons and shuttle',
      apply() {
        P = normProgress(data.lessons);
        L = hydrateLsat(data.lsat && data.lsat.meta, data.lsat && data.lsat.srs, data.lsat && data.lsat.cards, data.lsat && data.lsat.mc);
        if (course) C = course;
        commit(...DOCS); return 'Backup restored';
      },
    };
  }
  if (data && Array.isArray(data.decks) && Array.isArray(data.cards)) return { error: 'That’s a backup from the old LSAT flashcards app. The LSAT Line replaced those flashcards, so there’s nothing to bring over from it.' };
  if (data && Array.isArray(data.history)) {
    return {
      summary: `Lesson progress: ${plural(data.history.length, 'lesson')}. Importing replaces your lesson history, tickets and quiz tokens here.`,
      button: 'Replace lesson history',
      apply() { P = normProgress(data); commit('progress'); return 'Lesson history restored'; },
    };
  }
  return { error: 'That JSON isn’t a Daily Line backup or lesson progress.' };
}

  openModal({

  else if (a === 'ls-pick') lsPick(+el.dataset.i);

  else if (a === 'add-card') cardModal(null);

document.addEventListener('input', (e) => {
  if (e.target.id === 'q' && view.name === 'line' && view.deckId) {
    view.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) { /* ignore */ }
  }

document.addEventListener('change', (e) => {
  if (view.name !== 'line' || !view.deckId) return;
  if (e.target.id === 'filter') { view.filter = e.target.value; render(); }
});
document.addEventListener('keydown', (e) => {
  if (modalClose) { if (e.key === 'Escape') modalClose(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  // Tappable passage segments are spans; let Enter and Space press them like buttons.
  if ((k === ' ' || k === 'enter') && e.target.matches && e.target.matches('[role="button"][data-act]') && e.target.tagName !== 'BUTTON') { e.preventDefault(); e.target.click(); return; }
  const onButton = (k === ' ' || k === 'enter') && e.target.closest && e.target.closest('button, a');
  if (view.name === 'trip') {
    const v = view;
    if (k === 'escape') { endTrip(); return; }
    if (onButton) return;
    if (v.stage === 'lesson') {
      if (v.picked === null) { const idx = keyIndex(k, v.ords[v.at].length); if (idx >= 0) pickAnswer(idx); }
      else if (k === ' ' || k === 'enter') { e.preventDefault(); nextStep(); }
    } else if (v.stage === 'lsat') {
      const st = lsStep();
      if (!st) return;
      const open = st.k === 'item' && st.right === undefined;
      if (open && st.it.k === 'mc') { const idx = keyIndex(k, st.it.o.length); if (idx >= 0) lsPick(idx); }
      else if (!open && (k === ' ' || k === 'enter')) { e.preventDefault(); lsNext(); }
    } else if (v.stage === 'review' && session) {
      const cur = reviewCur();
      if (!cur) return;
      if (cur.right !== undefined) { if (k === ' ' || k === 'enter') { e.preventDefault(); rvNext(); } }
      else if (cur.mc) { const idx = keyIndex(k, cur.ord.length); if (idx >= 0) rvPick(idx); }
      else if (!cur.shown) { if (k === ' ' || k === 'enter') { e.preventDefault(); flip(); } }
      else if (k === 'y') rvSelf(true);
      else if (k === 'n') rvSelf(false);
    } else if (v.stage === 'transfer' && k === 'enter') { e.preventDefault(); continueTrip(); }
    return;
  }
  if (view.name === 'line' && view.deckId) {
    if (k === 'n') { e.preventDefault(); cardModal(null); }
    else if (k === '/') { e.preventDefault(); $('#q').focus(); }
  }
});

  if (document.visibilityState === 'hidden') { if (dirty.size) flush(); return; }
  if (today() !== renderedDay && view.name === 'tab' && !modalClose) render();
  if (col && !dirty.size && Date.now() - lastPull > 20000 && view.name !== 'trip') pull().then((ch) => { if (ch && !modalClose && view.name !== 'trip') render(); });
});

/* ================= boot ================= */
loadLocal();
const hash = (location.hash || '').slice(1);
if (TAB_IDS.includes(hash)) tab = hash;
if (hash === 'lsat') openLsat(); else render();
connect();
})();
</script>
