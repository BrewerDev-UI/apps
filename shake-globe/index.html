<style>
/* Layout: one glass globe owns the top of the screen; a soft panel below swaps Play / Build / Shelf without moving the globe. */
:root{
  --night:#0F1433; --plum:#241B4A; --ice:#C8C2F5; --frost:#9FD3F0; --sugar:#F6F3FF; --ember:#FF8A5B; --gold:#F2C46D;
  --panel:rgba(36,27,74,.72); --line:rgba(200,194,245,.18); --muted:#A9A3D6;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Gabarito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--sugar);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.sky{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 70% at 50% -10%,#3A2C7A 0%,transparent 60%),
  radial-gradient(80% 50% at 100% 100%,rgba(255,138,91,.16),transparent 70%),
  radial-gradient(70% 40% at 0% 80%,rgba(159,211,240,.12),transparent 70%),var(--night)}
.sky canvas{width:100%;height:100%;display:block}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 96px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:2.1rem;line-height:1;margin:0;letter-spacing:-.01em}
h1 b{font-style:normal;color:var(--gold);font-weight:400}
.count{display:flex;align-items:center;gap:8px;background:rgba(15,20,51,.6);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.odo{display:inline-flex;font-family:var(--mono);font-weight:700;font-size:1.05rem;color:var(--sugar);height:1.3em;overflow:hidden;line-height:1.3em}
.odo span{display:block;transition:transform 1.4s cubic-bezier(.2,.9,.2,1)}
.odo span i{display:block;font-style:normal;height:1.3em}
.stage{position:relative;display:grid;place-items:center;touch-action:none;user-select:none}
#globe{width:100%;max-width:440px;aspect-ratio:1/1.08;display:block;cursor:grab}
#globe:active{cursor:grabbing}
.hint{position:absolute;bottom:2px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:opacity .6s}
.panelwrap{position:relative;min-height:230px}
.panel{position:absolute;inset:0 0 auto;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.2,1)}
.panel.on{opacity:1;transform:none;pointer-events:auto;position:relative}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--sugar);font:600 .95rem var(--body);border-radius:16px;padding:13px 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:1 1 auto;justify-content:center;position:relative;overflow:visible;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.hot{background:var(--ember);color:#2A1206;border-color:transparent}
.btn.gold{background:var(--gold);color:#2A1D05;border-color:transparent}
.btn svg{width:18px;height:18px}
.bloom{position:absolute;inset:-2px;border-radius:18px;border:2px solid var(--gold);opacity:0;pointer-events:none}
.bloom.go{animation:bloom .7s ease-out}
@keyframes bloom{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.fact{font-family:var(--display);font-size:1.15rem;line-height:1.3;color:var(--ice);padding:2px 4px;min-height:3em;transition:opacity .5s}
.fact small{display:block;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label,.lab{font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:rgba(15,20,51,.55);color:var(--sugar);font:600 .85rem var(--body);border-radius:999px;padding:8px 13px 8px 8px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:background .2s,border-color .2s}
.chip .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,196,109,.16)}
input[type=text]{width:100%;box-sizing:border-box;background:rgba(15,20,51,.6);border:1px solid var(--line);color:var(--sugar);font:600 1rem var(--body);border-radius:14px;padding:12px 14px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:6px 4px 18px;background:linear-gradient(transparent calc(100% - 14px),#5B3A24 calc(100% - 14px),#3E2717)}
.shelf .slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:0;color:var(--sugar);font:600 .74rem var(--body);padding:0}
.shelf canvas{width:100%;aspect-ratio:1/1.08;display:block}
.shelf .x{position:absolute;top:-2px;right:2px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--night);color:var(--muted);font-size:14px;line-height:1;display:grid;place-items:center;cursor:pointer}
.shelf .tag{font:500 .6rem var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.empty{color:var(--muted);font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(15,20,51,.95) 35%)}
.tabbar{display:flex;gap:4px;background:rgba(36,27,74,.9);border:1px solid var(--line);border-radius:999px;padding:4px;width:100%;max-width:420px;position:relative}
.tab{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:700 .9rem var(--body);padding:11px 6px;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.tab[aria-selected="true"]{color:#2A1D05}
.pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--gold);transition:transform .45s cubic-bezier(.2,.9,.2,1),width .3s;z-index:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sugar);color:var(--night);font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;transition:.35s;z-index:30;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.kids header,body.kids nav.tabs,body.kids .panelwrap{display:none}
body.kids #globe{max-width:none;width:min(100%,calc((100vh - 90px) / 1.08));width:min(100%,calc((100dvh - 90px) / 1.08));height:auto}
.kidbar{display:none}
body.kids .kidbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kidbar p{margin:0;font-family:var(--display);font-size:1.3rem;color:var(--ice)}
.web-only{display:none}
.is-web .web-only{display:inline-flex}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="sky"><canvas id="sky"></canvas></div>
<div class="app">
  <header>
    <h1>Shake <b>Globe</b></h1>
    <div class="count" aria-label="Sleeps until Christmas"><span class="odo" id="odo"></span><span id="odoLab">sleeps to Christmas</span></div>
  </header>
  <div class="kidbar"><p>Tap anywhere to play the song</p><button class="btn" id="kidsOff" style="flex:0 0 auto">Done</button></div>

  <div class="stage" id="stage">

  </div>

  <div class="panelwrap">
    <section class="panel on" id="p-play" aria-label="Play">
      <div class="row">
        <button class="btn hot" id="shakeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8c2-3 5-3 8 0s6 3 8 0M4 16c2-3 5-3 8 0s6 3 8 0"/></svg>Shake</button>
        <button class="btn" id="windBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span id="windLab">Wind up the song</span></button>
      </div>
      <div class="row">
        <button class="btn web-only" id="motionBtn">Shake my phone</button>
        <button class="btn" id="kidsBtn">Little hands mode</button>
      </div>
      <div class="fact" id="fact"></div>
    </section>

    <section class="panel" id="p-build" aria-label="Build">
      <div class="opt"><label>Scene</label><div class="chips" id="c-scene"></div></div>
      <div class="opt"><label>Sky</label><div class="chips" id="c-sky"></div></div>
      <div class="opt"><label>Snow</label><div class="chips" id="c-snow"></div></div>
      <div class="opt"><label>Base</label><div class="chips" id="c-base"></div></div>
      <div class="opt"><label>Song</label><div class="chips" id="c-song"></div></div>
      <div class="opt"><label for="msg">Plaque</label><input type="text" id="msg" maxlength="26" value="Let it snow"></div>
      <div class="row">
        <button class="btn" id="photoBtn">Put a photo inside</button>
        <button class="btn" id="photoClear" hidden>Remove photo</button>

    <section class="panel" id="p-shelf" aria-label="Shelf">
      <div class="row">
        <button class="btn gold" id="saveBtn"><span class="bloom" id="bloom"></span>Put this globe on the shelf</button>
      </div>
      <div class="row">
        <button class="btn" id="cardBtn">Save as a card</button>
        <button class="btn web-only" id="shareBtn">Send it</button>
        <button class="btn web-only" id="clipBtn">Record a shake clip</button>
      </div>
      <div class="lab">Your shelf · tap a globe to bring it back</div>
      <div class="shelf" id="shelf"></div>
    </section>
  </div>
</div>

<nav class="tabs"><div class="tabbar" role="tablist"><span class="pill" id="pill"></span>
  <button class="tab" role="tab" aria-selected="true" data-p="play">Play</button>
  <button class="tab" role="tab" aria-selected="false" data-p="build">Build</button>
  <button class="tab" role="tab" aria-selected="false" data-p="shelf">Shelf</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
(function(){
const WEB = !!window.__WEB__;
if (WEB) document.documentElement.classList.add('is-web');
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem('shakeglobe:'+k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('shakeglobe:'+k,JSON.stringify(v)); return true }catch(e){ return false } }
};
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200) }

/* ---------- options ---------- */
const SCENES = {cabin:'Cabin & pines', arch:'The Arch', snowman:'Snowman', ginger:'Gingerbread', village:'Tiny village', photo:'Your photo'};
const SKIES = {
  midnight:{n:'Midnight', g:['#141B4D','#2B2470','#4B3A8C'], stars:true},
  aurora:{n:'Aurora', g:['#0B1A3A','#123A5C','#2A3F7A'], stars:true, aurora:true},
  dusk:{n:'Dusk', g:['#2B1E5A','#7A3E78','#E07A6A'], stars:false},
  dawn:{n:'Pink dawn', g:['#5C6BC0','#B9A4E8','#F7C6D0'], stars:false},
  frost:{n:'Frost', g:['#8FB8DE','#C8DDF2','#EEF4FB'], stars:false}
};
const SNOWS = {flakes:{n:'Classic flakes', c:'#FFFFFF'}, glitter:{n:'Gold glitter', c:'#F2C46D'}, stars:{n:'Little stars', c:'#C8C2F5'}, confetti:{n:'Confetti', c:'#FF8A5B'}};
const BASES = {walnut:{n:'Walnut', a:'#6B4226', b:'#3E2412', t:'#F2C46D'}, gold:{n:'Gold', a:'#E9C46A', b:'#A9792A', t:'#3B2A08'}, ruby:{n:'Ruby', a:'#B3263E', b:'#6E1023', t:'#F7D9A8'}, frost:{n:'Frost white', a:'#EEF1FF', b:'#B7BEE6', t:'#2B2470'}};
const SONGS = {
  jingle:{n:'Jingle Bells', bpm:150, notes:[[64,1],[64,1],[64,2],[64,1],[64,1],[64,2],[64,1],[67,1],[60,1.5],[62,.5],[64,4],[65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5],[64,1],[62,1],[62,1],[64,1],[62,2],[67,2]]},
  tree:{n:'O Christmas Tree', bpm:110, notes:[[62,1],[67,.75],[67,.25],[67,1.5],[69,.5],[71,.75],[71,.25],[71,1.5],[71,.5],[69,.5],[71,.5],[72,1],[66,1],[69,1],[67,2]]},
  deck:{n:'Deck the Halls', bpm:140, notes:[[67,1.5],[65,.5],[64,1],[62,1],[60,1],[62,1],[64,1],[60,1],[62,.5],[64,.5],[65,.5],[62,.5],[64,1.5],[62,.5],[60,1],[59,1],[60,2]]},
  silent:{n:'Silent Night', bpm:100, notes:[[67,1.5],[69,.5],[67,1],[64,3],[67,1.5],[69,.5],[67,1],[64,3],[74,2],[74,1],[71,3],[72,2],[72,1],[67,3]]},
  off:{n:'No song', bpm:0, notes:[]}
};
const FACTS = [
  ['1878','A snow globe showed up at the Paris Exposition that year: a little man with an umbrella, and white powder that fell when you turned it over.'],
  ['Vienna, 1900','Erwin Perzy was trying to make surgical lamps brighter with a water-filled flask. The specks floating in it looked like snow, and the snow globe business was born. His family still runs the shop.'],
  ['Old-school snow','Early globes used bone chips, porcelain bits, sand or sawdust as snow. Later came gold foil and soap flakes.'],
  ['Why it falls slowly','The water gets a dose of glycerol, which thickens it so flakes drift instead of drop. This app fakes that with drag, so try a hard shake.'],
  ['1941','Citizen Kane opens with a snow globe and the word "Rosebud." It shatters when he dies.'],
  ['The Christmas switch','Feeds flipped from Halloween to holiday decor on Nov 1, and LEGO even has a snow globe build series this season.']
];

const DEFAULT = {scene:'cabin', sky:'midnight', snow:'flakes', base:'walnut', song:'jingle', msg:'Let it snow', photo:null};
let cfg = Object.assign({}, DEFAULT, store.get('current', {}));
let photoImg = null;

/* ---------- countdown odometer ---------- */
function sleeps(){ const n=new Date(); let y=n.getFullYear(); let x=new Date(y,11,25); if (n>x && n.getDate()!==25) x=new Date(y+1,11,25); const t=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.max(0,Math.round((x-t)/864e5)) }
const SLEEPS = sleeps();
(function(){
  const s=String(SLEEPS).padStart(2,'0'); const odo=$('#odo'); odo.innerHTML='';
  [...s].forEach((d,i)=>{ const col=document.createElement('span'); col.innerHTML=Array.from({length:10},(_,k)=>'<i>'+k+'</i>').join(''); odo.appendChild(col); requestAnimationFrame(()=>requestAnimationFrame(()=>{ col.style.transitionDelay=(i*.15)+'s'; col.style.transform='translateY(-'+(+d*1.3)+'em)'; })) });
  if (SLEEPS===0) $('#odoLab').textContent='Merry Christmas';
  else if (SLEEPS===1) $('#odoLab').textContent='sleep to Christmas';
})();

/* ---------- canvas ---------- */
const cv=$('#globe'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2.5,window.devicePixelRatio||1); const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
window.addEventListener('resize',()=>{resize()});

/* particles in normalized globe space: center 0,0, radius 1 */
const N=320; let parts=[];
function ground(x){ return .5 + .16*x*x }
function seed(){ parts=[]; for(let i=0;i<N;i++){ const x=(Math.random()*2-1)*.85; parts.push({x, y:ground(x)-Math.random()*.02, vx:0, vy:0, r:.006+Math.random()*.012, rest:true, tw:Math.random()*6.28, hue:Math.random()}) } }
seed();
let grav={x:0,y:.22};
function kick(dx,dy,power){ power=power||1; parts.forEach(p=>{ const f=(p.rest?1.2:.6)*power; p.vx+=(dx*.6+(Math.random()-.5)*1.6)*f; p.vy+=(dy*.6-(Math.random()*1.4+.3))*f; p.rest=false }); wob.vx+=dx*40; wob.vy+=dy*40; buzz(power>1.3?[20,30,20]:15); }
const wob={x:0,y:0,vx:0,vy:0};
function step(dt){
  // wobble spring
  wob.vx+=(-wob.x*90-wob.vx*9)*dt; wob.vy+=(-wob.y*90-wob.vy*9)*dt; wob.x+=wob.vx*dt; wob.y+=wob.vy*dt;
  const drag=Math.exp(-1.7*dt);
  for(const p of parts){
    if(p.rest) continue;
    p.vx=(p.vx+grav.x*dt)*drag; p.vy=(p.vy+grav.y*dt)*drag;
    p.vx+=Math.sin(p.tw+performance.now()/900)*.004;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.tw+=dt*3;
    const d=Math.hypot(p.x,p.y);
    if(d>.94){ const nx=p.x/d, ny=p.y/d; p.x=nx*.94; p.y=ny*.94; const dot=p.vx*nx+p.vy*ny; p.vx-=1.6*dot*nx; p.vy-=1.6*dot*ny; }
    const g=ground(p.x);
    if(p.y>=g-.004 && Math.hypot(p.vx,p.vy)<.25){ p.y=g-Math.random()*.012; p.vx=p.vy=0; p.rest=true }
  }
}

/* drawing */
function drawScene(c,cx,cy,R,cf,t,img){
  const sky=SKIES[cf.sky];
  c.save(); c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.clip();
  if(cf.scene==='photo' && img){
    const s=Math.max(2*R/img.width,2*R/img.height); const w=img.width*s,h=img.height*s;
    c.drawImage(img,cx-w/2,cy-h/2,w,h);
    const vg=c.createRadialGradient(cx,cy,R*.4,cx,cy,R); vg.addColorStop(0,'rgba(15,20,51,0)'); vg.addColorStop(1,'rgba(15,20,51,.55)'); c.fillStyle=vg; c.fillRect(cx-R,cy-R,2*R,2*R);
  } else {
    const g=c.createLinearGradient(0,cy-R,0,cy+R); g.addColorStop(0,sky.g[0]); g.addColorStop(.55,sky.g[1]); g.addColorStop(1,sky.g[2]); c.fillStyle=g; c.fillRect(cx-R,cy-R,2*R,2*R);
    if(sky.stars){ c.fillStyle='rgba(255,255,255,.8)'; for(let i=0;i<40;i++){ const a=(i*137.5)%360*Math.PI/180, rr=((i*53)%100)/100*R*.85; const x=cx+Math.cos(a)*rr, y=cy-Math.abs(Math.sin(a))*rr*.9; const tw=.5+.5*Math.sin(t*2+i); c.globalAlpha=.3+.6*tw; c.fillRect(x,y,1.4,1.4) } c.globalAlpha=1 }
    if(sky.aurora){ for(let k=0;k<3;k++){ c.beginPath(); for(let x=-R;x<=R;x+=6){ const y=cy-R*.35+k*R*.12+Math.sin(x/(R*.25)+t*.7+k)*R*.08; x===-R?c.moveTo(cx+x,y):c.lineTo(cx+x,y) } c.strokeStyle=['rgba(120,255,200,.35)','rgba(159,211,240,.3)','rgba(200,194,245,.25)'][k]; c.lineWidth=R*.09; c.lineCap='round'; c.stroke() } }
    if(cf.sky==='midnight'||cf.sky==='aurora'){ c.fillStyle='rgba(246,243,255,.9)'; c.beginPath(); c.arc(cx+R*.42,cy-R*.48,R*.09,0,7); c.fill(); c.fillStyle=sky.g[0]; c.beginPath(); c.arc(cx+R*.46,cy-R*.51,R*.08,0,7); c.fill() }
    // scene pieces
    const gy=cy+R*.5;
    const S=SCENEDRAW[cf.scene]; if(S) S(c,cx,gy,R,t);

  chipRow('#c-snow',SNOWS,'snow',(k,v)=>v.c);
  chipRow('#c-base',BASES,'base',(k,v)=>'linear-gradient(180deg,'+v.a+','+v.b+')');
  chipRow('#c-song',SONGS,'song',k=>({jingle:'#F2C46D',tree:'#2F7766',deck:'#B3263E',silent:'#2B2470',off:'transparent'}[k]));
}
$('#msg').value=cfg.msg; $('#msg').addEventListener('input',e=>{ cfg.msg=e.target.value; save() });
function save(){ const c=Object.assign({},cfg); store.set('current',c) }
$('#photoBtn').onclick=()=>$('#photoIn').click();
$('#photoIn').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,480/Math.max(im.width,im.height)); const oc=document.createElement('canvas'); oc.width=Math.round(im.width*s); oc.height=Math.round(im.height*s); oc.getContext('2d').drawImage(im,0,0,oc.width,oc.height); const url=oc.toDataURL('image/jpeg',.8); setPhoto(url); cfg.scene='photo'; cfg.photo=url; save(); buildChips(); kick(0,-.6,1.2); toast('Your photo is inside the globe') }; im.src=r.result }; r.readAsDataURL(f); e.target.value='' });
function setPhoto(url){ if(!url){ photoImg=null; $('#photoClear').hidden=true; return } const im=new Image(); im.onload=()=>{ photoImg=im }; im.src=url; $('#photoClear').hidden=false }
$('#photoClear').onclick=()=>{ cfg.photo=null; if(cfg.scene==='photo') cfg.scene='cabin'; setPhoto(null); save(); buildChips() };

/* ---------- tabs ---------- */
const tabs=[...document.querySelectorAll('.tab')];
function setTab(name){ tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.p===name)); document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+name)); const i=tabs.findIndex(t=>t.dataset.p===name); const tb=tabs[i]; $('#pill').style.width=tb.offsetWidth+'px'; $('#pill').style.transform='translateX('+(tb.offsetLeft-4)+'px)'; if(name==='shelf') renderShelf() }
tabs.forEach(t=>t.onclick=()=>setTab(t.dataset.p));

/* ---------- shelf ---------- */
const EXAMPLES=[{scene:'arch',sky:'aurora',snow:'glitter',base:'gold',song:'deck',msg:'Merry from St. Louis',ex:true},{scene:'snowman',sky:'dawn',snow:'stars',base:'ruby',song:'tree',msg:'First snow',ex:true}];
let shelf=store.get('shelf',null); if(!shelf) shelf=EXAMPLES.slice();
function renderShelf(){ const el=$('#shelf'); el.innerHTML='';
  if(!shelf.length){ el.innerHTML='<p class="empty">Nothing on the shelf yet. Build a globe, then put it here.</p>'; return }
  shelf.forEach((g,i)=>{ const b=document.createElement('div'); b.className='slot'; b.tabIndex=0; b.setAttribute('role','button'); b.setAttribute('aria-label','Load '+(g.msg||'globe'));
    const c=document.createElement('canvas'); const s=120; c.width=s*2; c.height=Math.round(s*1.08*2); const x=c.getContext('2d'); x.scale(2,2);
    const ps=Array.from({length:70},(_,k)=>{ const xx=((k*37)%100)/100*1.7-.85; return {x:xx,y:ground(xx)-.01,r:.012,tw:k,hue:(k%5)/5} });
    const finish=img=>{ x.clearRect(0,0,s,s*1.08); drawGlobe(x,s,s*1.08,g,1,ps,img) };
    if(g.scene==='photo'&&g.photo){ const im=new Image(); im.onload=()=>finish(im); im.src=g.photo } else finish(null);
    const lab=document.createElement('span'); lab.textContent=g.msg||'Untitled';
    b.append(c,lab); if(g.ex){ const t=document.createElement('span'); t.className='tag'; t.textContent='Example'; b.append(t) }
    const xb=document.createElement('button'); xb.className='x'; xb.type='button'; xb.setAttribute('aria-label','Remove from shelf'); xb.textContent='×'; xb.onclick=ev=>{ ev.stopPropagation(); shelf.splice(i,1); store.set('shelf',shelf); renderShelf() }; b.append(xb);
    const load=()=>{ cfg=Object.assign({},DEFAULT,g); delete cfg.ex; setPhoto(cfg.photo); $('#msg').value=cfg.msg; buildChips(); save(); kick(0,-.8,1.4); chime(); toast('Back on the stand: '+(g.msg||'globe')); setTab('play') };
    b.onclick=load; b.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); load() } };
    el.appendChild(b) }) }
$('#saveBtn').onclick=()=>{ const g=Object.assign({},cfg); if(g.scene!=='photo') g.photo=null; shelf.unshift(g); if(shelf.length>9) shelf.length=9; const ok=store.set('shelf',shelf); const bl=$('#bloom'); bl.classList.remove('go'); void bl.offsetWidth; bl.classList.add('go'); buzz([10,40,10]); chime(); renderShelf(); toast(ok?'On the shelf':'On the shelf for now. This browser won\'t keep it after you close the page.') };

/* ---------- card export ---------- */
function makeCard(){ const w=1080,h=1350; const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#2B2470'); g.addColorStop(1,'#0F1433'); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='rgba(246,243,255,.5)'; for(let i=0;i<140;i++){ x.beginPath(); x.arc((i*263)%w,(i*151)%h,1+(i%3),0,7); x.fill() }
  x.save(); x.translate(90,150); drawGlobe(x,900,972,cfg,T,parts,photoImg); x.restore();
  x.fillStyle='#F2C46D'; x.textAlign='center'; x.font='italic 76px "Instrument Serif", Georgia, serif'; x.fillText('Shake Globe',w/2,110);
  x.fillStyle='#C8C2F5'; x.font='600 36px "Gabarito", system-ui, sans-serif'; x.fillText(SLEEPS? SLEEPS+(SLEEPS===1?' sleep':' sleeps')+' to Christmas':'Merry Christmas',w/2,h-60);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png')) }
function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000) }
$('#cardBtn').onclick=async()=>{ const blob=await makeCard(); const name='shake-globe-card.png';
  if(WEB){ dl(blob,name); toast('Card saved'); return }
  try{ const d=window.claude&&await window.claude.use('downloads'); if(!d){ toast('Saving isn\'t available in this view'); return } const r=await d.save({filename:name,data:blob}); if(r&&r.status==='saved') toast('Card saved') }catch(e){ if(e&&e.code==='declined') return; toast('Couldn\'t save the card here') } };
$('#shareBtn').onclick=async()=>{ const blob=await makeCard(); const f=new File([blob],'shake-globe.png',{type:'image/png'});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Shake Globe',text:cfg.msg}); return } if(navigator.share){ await navigator.share({title:'Shake Globe',text:cfg.msg+' · made with Shake Globe',url:location.href}); return } dl(blob,'shake-globe.png'); toast('Sharing isn\'t supported, so the card was saved') }catch(e){} };
$('#clipBtn').onclick=async()=>{ if(!cv.captureStream||typeof MediaRecorder==='undefined'){ toast('Clips need a newer browser'); return }
  const types=['video/mp4','video/webm;codecs=vp9','video/webm']; const type=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)); if(!type){ toast('Clips aren\'t supported here'); return }
  const st=cv.captureStream(30); const rec=new MediaRecorder(st,{mimeType:type}); const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{ const ext=type.includes('mp4')?'mp4':'webm'; const blob=new Blob(chunks,{type}); const f=new File([blob],'shake-globe.'+ext,{type});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Shake Globe'}); } else { dl(blob,'shake-globe.'+ext); toast('Clip saved') } }catch(e){} $('#clipBtn').textContent='Record a shake clip' };
  $('#clipBtn').textContent='Recording…'; rec.start(); setTab('play'); setTimeout(()=>{ kick(.5,-1,1.6); chime() },300); setTimeout(()=>kick(-.6,-.8,1.2),1400); setTimeout(()=>rec.stop(),4500) };

/* ---------- facts ---------- */
let fi=0; function showFact(){ const [h,b]=FACTS[fi%FACTS.length]; const el=$('#fact'); el.style.opacity=0; setTimeout(()=>{ el.innerHTML='<small>'+h+'</small>'+b; el.style.opacity=1 },300); fi++ }
showFact(); setInterval(showFact,9000);

/* ---------- boot ---------- */
setPhoto(cfg.scene==='photo'?cfg.photo:null); if(cfg.scene==='photo'&&!cfg.photo) cfg.scene='cabin';
buildChips(); resize(); setTab('play');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ resize(); setTab('play') });
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame) });
setTimeout(()=>kick(0,-.9,1.3),500);
if(WEB && 'DeviceMotionEvent' in window && !DeviceMotionEvent.requestPermission){ enableMotion() }
})();
</script>

<script>if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }</script>
</body></html>
